services:
  gosearch:
    build:
      context: .
      dockerfile: ./dockerfile
    volumes:
     - gosearch-data:/workspace
    labels:
      - "traefik.enable=true"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
      
    expose:
        - "7681"

volumes:
  gosearch-data:
